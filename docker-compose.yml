services:
  postgres:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  storage:
    build: ./services/storage
    env_file: .env
    ports:
      - "8001:8000" # для отладки
    volumes:
      - ./services/storage/config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

  collector:
    build: ./services/collector
    volumes:
      - ./services/collector/config.yaml:/app/config.yaml:ro
      - ./data:/app/data:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

  ml-service:
    build: ./services/ml-service
    volumes:
      - ./services/ml-service/config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
    depends_on: [storage]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

  web-master:
    build: ./services/web-master
    ports:
      - "8080:8000"
    volumes:
      - ./services/web-master/config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
    depends_on: [collector, storage, ml-service]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

  visualization:
    build: ./services/visualization
    ports:
      - "8050:8050"
    volumes:
      - ./services/visualization/config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
    depends_on: [web-master]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/health')"]
      interval: 5s
      retries: 10

volumes:
  pg_data: